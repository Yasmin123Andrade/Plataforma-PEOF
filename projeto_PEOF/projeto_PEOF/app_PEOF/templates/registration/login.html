<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar - PEOF</title>
    {% load static %}
   
    <!-- Bootstrap 4 CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    
    <!-- Fontawesome CDN -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">

    <!-- Estilos Customizados embutidos para evitar erros de caminhos estáticos -->
    <style>
        @import url('https://fonts.googleapis.com/css?family=Numans');

        html,body{
            background-image: url('{% static "img/fundo.jpg" %}');
            background-size: cover;
            background-repeat: no-repeat;
            min-height: 100vh;
            height: 100%;
            font-family: 'Numans', sans-serif;
        }

        .container{
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card{
            /* Aumentei um pouquinho a altura máxima para acomodar a mensagem de erro do Django sem quebrar o layout */
            min-height: 370px;
            margin: auto;
            width: 100%;
            max-width: 420px;
            background-color: rgba(0,0,0,0.82) !important;
            border: 1.5px solid rgba(255,255,255,0.92);
        }

        .social_icon span{
            font-size: 60px;
            margin-left: 10px;
            color: #0D5E72;
        }

        .social_icon span:hover{
            color: white;
            cursor: pointer;
        }

        .card-header h3{
            color: white;
        }

        .social_icon{
            position: absolute;
            right: 20px;
            top: -45px;
        }

        .input-group-prepend span{
            width: 50px;
            background-color: #0D5E72;
            color: white;
            border:0 !important;
        }

        input:focus{
            outline: 0 0 0 0 !important;
            box-shadow: 0 0 0 0 !important;
        }

        .remember{
            color: white;
        }

        .remember input{
            width: 20px;
            height: 20px;
            margin-left: 15px;
            margin-right: 5px;
        }

        .login_btn{
            color: white;
            background-color: #0D5E72;
            width: 100px;
            border: none;
        }

        .login_btn:hover{
            color: white;
            background-color: #094855;
        }

        .links{
            color: white;
        }

        .links a{
            margin-left: 4px;
            color: #0D5E72;
        }
        
        .error-msg {
            color: #ff4d4d;
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff4d4d;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }

        @media (max-width: 576px) {
            .card {
                max-width: 100%;
                padding: 20px 15px;
            }

            .social_icon {
                position: static;
                margin-bottom: 15px;
                text-align: center;
            }

            .social_icon span {
                margin-left: 5px;
                font-size: 50px;
            }

            .card-header {
                padding-bottom: 0.75rem;
            }

            .card-body {
                padding: 1rem 0.75rem;
            }

            .input-group-prepend span {
                width: 45px;
            }

            .login_btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-center h-100">
        <div class="card">
            <div class="card-header">
                <h3>Entrar</h3>
                <div class="d-flex justify-content-end social_icon">
                    <span><i class="fab fa-facebook-square"></i></span>
                    <span><i class="fab fa-google-plus-square"></i></span>
                    <span><i class="fab fa-twitter-square"></i></span>
                </div>
            </div>
            <div class="card-body">
                
                <!-- Alerta de erro nativo do Django caso digitem dados incorretos -->
                {% if form.errors %}
                    <div class="error-msg">
                        Usuário ou senha inválidos. Tem certeza que digitou certo?
                    </div>
                {% endif %}

                <!-- Formulário configurado para POST -->
                <form method="POST">
                    <!-- Segurança do Django obrigatória -->
                    {% csrf_token %}
                    
                    <div class="input-group form-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <!-- Atributo name="username" adicionado -->
                        <input type="text" name="username" class="form-control" placeholder="Usuário" required>
                    </div>
                    
                    <div class="input-group form-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                        </div>
                        <!-- Atributo name="password" adicionado -->
                        <input type="password" name="password" class="form-control" placeholder="Senha" required>
                    </div>
                    
                    <div class="row align-items-center remember">
                        <input type="checkbox">Lembre-me
                    </div>
                    
                    <div class="form-group">
                        <input type="submit" value="Entrar" class="btn float-right login_btn">
                    </div>
                </form>
            </div>
            <div class="card-footer">
                <div class="d-flex justify-content-center links">
                    Ainda não tem uma conta?<a href="{% url 'register' %}"> Cadastre-se</a>
                </div>
                <div class="d-flex justify-content-center">
                    <a href="{% url 'password_reset' %}">Esqueceu a senha?</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
</body>
</html>
