<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
   
    <title>Senha atualizada - PEOF</title>
    {% load static %}
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
   
    <style>
        @import url('https://fonts.googleapis.com/css?family=Numans');
        html,body{background-image: url('{% static "img/fundo.jpg" %}');background-size: cover;background-repeat: no-repeat;min-height: 100vh;height: 100%;font-family: 'Numans', sans-serif;}
        .container{min-height: 100vh;padding: 20px 15px;display: flex;align-items: center;justify-content: center;}
        .card{min-height: 240px;margin: auto;width: 100%;max-width: 420px;background-color: rgba(0,0,0,0.82) !important;border: 1.5px solid rgba(255,255,255,0.92);}
        .card-header h3{color: white;}
        .card-body p{color: white;}
        .links{color: white;}
        .links a{margin-left: 4px;color: #00D4FF;font-weight: bold;text-decoration: none;}
        .links a:hover{text-decoration: underline;}
        .login_btn{color: white;background-color: #0D5E72;border: none;}
        .login_btn:hover{background-color: #094855;}
        @media (max-width: 576px){.card{max-width: 100%;padding: 20px 15px;}}
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-center h-100">
        <div class="card">
            <div class="card-header">
                <h3>Senha atualizada</h3>
            </div>
            <div class="card-body">
                <p>Sua senha foi redefinida com sucesso. Agora você pode fazer login com a nova senha.</p>
            </div>
            <div class="card-footer">
                <div class="d-flex justify-content-center links">
                    <a href="{% url 'login' %}">Ir para o login</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
