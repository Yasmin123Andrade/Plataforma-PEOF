<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha atualizada - PEOF</title>
    {% load static %}

    <!-- Google Fonts & FontAwesome CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos Customizados (Modelo PEOF eLearning) -->
    <style>
        :root {
            --peof-primary: #06BBCC;
            --peof-primary-2: #3B82F6;
            --peof-dark: #0E1330;
            --peof-dark-2: #181d38;
            --peof-light: #F0FBFC;
            --peof-ink: #0E1330;
            --peof-muted: #8C97C4;
            --peof-success: #10B981;
        }

        body.peof-auth {
            min-height: 100vh;
            margin: 0;
            font-family: 'Heebo', sans-serif;
            color: #fff;
            background:
                radial-gradient(1100px 620px at 82% -8%, rgba(6,187,204,.28), transparent 60%),
                radial-gradient(900px 560px at 8% 108%, rgba(59,130,246,.22), transparent 60%),
                linear-gradient(160deg, var(--peof-dark) 0%, var(--peof-dark-2) 55%, #0B0F26 100%);
            position: relative;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        h1, h2, h3, .peof-brand-word {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
        }

        .peof-watermark {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 0; pointer-events: none; overflow: hidden;
        }
        .peof-watermark span {
            font-family: 'Nunito', sans-serif; font-weight: 800;
            font-size: min(30vw, 340px);
            color: rgba(255,255,255,.035);
            letter-spacing: .02em; line-height: 1;
        }

        .peof-orbit-bg {
            position: absolute; top: 50%; left: 50%;
            width: min(60vw, 620px); height: min(60vw, 620px);
            transform: translate(-50%,-50%);
            z-index: 0; opacity: .55; pointer-events: none;
        }

        .peof-chip {
            position: absolute;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: .78rem; color: rgba(255,255,255,.55);
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.12);
            padding: .35rem .7rem; border-radius: 100px;
            backdrop-filter: blur(4px); z-index: 1;
        }

        .peof-auth-shell { position: relative; z-index: 2; width: 100%; max-width: 460px; }

        .peof-logo-row { display: flex; align-items: center; justify-content: center; gap: .6rem; margin-bottom: 1.6rem; }
        .peof-logo-mark { width: 40px; height: 40px; }
        .peof-brand-word { font-size: 1.7rem; color: #fff; letter-spacing: .01em; }
        .peof-brand-word small {
            display: block; font-family: 'Heebo', sans-serif; font-weight: 400;
            font-size: .62rem; letter-spacing: .14em; text-transform: uppercase;
            color: var(--peof-muted); margin-top: -2px;
        }

        .peof-card {
            background: rgba(17,23,52,.68);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 22px;
            padding: 2.1rem 2.1rem 1.9rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 40px 80px -30px rgba(0,0,0,.65);
            text-align: center;
        }

        .peof-card-head { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            margin-bottom: 1.2rem; 
        }
        
        .peof-card-head h2 { font-size: 1.4rem; color: #fff; margin-top: .8rem; }
        
        .peof-icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--peof-success);
            font-size: 1.5rem;
            box-shadow: 0 8px 20px -6px rgba(16, 185, 129, 0.4);
        }

        .peof-card-body p {
            color: #C4CCE8;
            font-size: .95rem;
            line-height: 1.6;
            margin-bottom: 1.6rem;
        }

        .peof-btn {
            display: inline-block;
            width: 100%; border: none; border-radius: 12px; padding: .85rem;
            font-family: 'Nunito', sans-serif; font-weight: 800; font-size: .98rem; color: #fff;
            background: linear-gradient(120deg, var(--peof-primary), var(--peof-primary-2));
            box-shadow: 0 14px 30px -10px rgba(6,187,204,.55);
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
            cursor: pointer;
            text-decoration: none;
        }
        .peof-btn:hover { transform: translateY(-2px); filter: brightness(1.06); color: #fff; }
        .peof-btn:active { transform: translateY(0); }

        .peof-tagline {
            display: flex; align-items: center; justify-content: center; gap: .55rem;
            margin-top: 2rem; padding: .65rem 1.3rem;
            background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
            border-radius: 100px; font-family: 'Nunito', sans-serif; font-weight: 700;
            font-size: .82rem; letter-spacing: .04em; color: #DCE3F7; backdrop-filter: blur(6px);
        }
        .peof-tagline i { color: var(--peof-primary); }
        .peof-tagline .accent { color: var(--peof-primary); }

        @media (max-width: 480px) {
            .peof-card { padding: 1.6rem 1.3rem 1.5rem; }
            .peof-chip { display: none; }
        }
    </style>
</head>
<body class="peof-auth">

  <div class="peof-watermark"><span>PEOF</span></div>
  <svg class="peof-orbit-bg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="100" rx="90" ry="34" stroke="url(#g1)" stroke-width="1.4" opacity="0.5" transform="rotate(15 100 100)"/>
    <ellipse cx="100" cy="100" rx="90" ry="34" stroke="url(#g1)" stroke-width="1.4" opacity="0.5" transform="rotate(75 100 100)"/>
    <ellipse cx="100" cy="100" rx="90" ry="34" stroke="url(#g1)" stroke-width="1.4" opacity="0.5" transform="rotate(135 100 100)"/>
    <circle cx="100" cy="100" r="9" fill="url(#g1)"/>
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#06BBCC"/>
        <stop offset="100%" stop-color="#3B82F6"/>
      </linearGradient>
    </defs>
  </svg>

  <span class="peof-chip" style="top:12%; left:8%;">F = ma</span>
  <span class="peof-chip" style="top:20%; right:10%;">E = mc²</span>
  <span class="peof-chip" style="bottom:16%; left:7%;">T = 2π√(L/g)</span>
  <span class="peof-chip" style="bottom:22%; right:8%;">ΣF = m·a</span>

  <div class="peof-auth-shell">
    <div class="peof-logo-row">
      <svg class="peof-logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="20" cy="20" rx="17" ry="6.5" stroke="url(#lg)" stroke-width="2.2" transform="rotate(20 20 20)"/>
        <ellipse cx="20" cy="20" rx="17" ry="6.5" stroke="url(#lg)" stroke-width="2.2" transform="rotate(100 20 20)"/>
        <circle cx="20" cy="20" r="4.4" fill="url(#lg)"/>
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#06BBCC"/>
            <stop offset="100%" stop-color="#3B82F6"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="peof-brand-word">PEOF<small>Olimpíadas de Física</small></span>
    </div>

    <div class="peof-card">
      <div class="peof-card-head">
        <div class="peof-icon-badge">
          <i class="fas fa-check-circle"></i>
        </div>
        <h2>Senha atualizada</h2>
      </div>

      <div class="peof-card-body">
        <p>Sua senha foi redefinida com sucesso. Agora você pode fazer login com a nova senha.</p>
        <a href="{% url 'login' %}" class="peof-btn">Ir para o login</a>
      </div>
    </div>

    <div class="peof-tagline">
      <i class="fas fa-graduation-cap"></i>
      ESTUDE. ENTENDA. <span class="accent">VÁ ALÉM.</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
